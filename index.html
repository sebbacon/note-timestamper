<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:            #0f0e0c;
      --surface:       #181714;
      --surface-2:     #211f18;
      --border:        #2e2b22;
      --text:          #ddd4bc;
      --text-dim:      #8c8270;
      --text-muted:    #504a3d;
      --accent:        #c9a84c;
      --accent-soft:   rgba(201,168,76,.07);
      --accent-border: rgba(201,168,76,.2);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ──────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.75rem 2.5rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.35rem;
    }

    .brand {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.45em;
    }

    .brand::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .date-display {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .clock {
      font-family: 'Space Mono', monospace;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.025em;
      font-variant-numeric: tabular-nums;
    }

    .clock-sec { color: var(--accent); }

    /* ─── MAIN ────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 2.5rem 4rem;
      display: flex;
      flex-direction: column;
    }

    .section-label {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      display: block;
    }

    /* ─── TEXTAREA ────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 110px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.2rem;
      line-height: 1.75;
      padding: 0.9rem 1.1rem;
      resize: vertical;
      outline: none;
      caret-color: var(--accent);
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    textarea::placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    textarea:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .input-hint {
      margin-top: 0.55rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .input-hint kbd {
      font-family: 'Space Mono', monospace;
      font-size: 0.68em;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.05em 0.4em;
      color: var(--text-dim);
    }

    /* ─── DIVIDER ─────────────────────────────────── */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.25rem 0 1.75rem;
    }

    /* ─── TOOLBAR ─────────────────────────────────── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .entry-count {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .entry-count strong {
      font-family: 'Space Mono', monospace;
      color: var(--accent);
      font-weight: 400;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent-border);
      border-radius: 2px;
      padding: 0.38em 0.85em;
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s;
    }

    .download-btn:hover  { background: var(--accent-soft); border-color: rgba(201,168,76,.4); }
    .download-btn:active { background: rgba(201,168,76,.13); }

    .download-btn svg {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }

    /* ─── NOTES LIST ──────────────────────────────── */
    .notes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .notes-list li {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      column-gap: 1.5rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .notes-list li.new { animation: slide-in 0.25s ease forwards; }

    .note-ts {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1.75;
      padding-top: 0.2em;
    }

    .note-ts-date {
      display: block;
      font-size: 0.6em;
      color: var(--text-muted);
      margin-top: 0.2em;
      letter-spacing: 0.06em;
    }

    .note-body {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Empty state */
    li.empty-li {
      border: none;
      display: block;
      padding: 3rem 0;
      text-align: center;
    }

    .empty-msg {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ─── SCROLLBAR ───────────────────────────────── */
    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ─── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 520px) {
      header    { padding: 1.25rem 1.25rem 1rem; }
      main      { padding: 1.5rem 1.25rem 3rem; }
      .notes-list li { grid-template-columns: 1fr; column-gap: 0; row-gap: 0.2rem; }
      .note-ts  { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <span class="brand">Field Notes</span>
      <span class="date-display" id="date-display"></span>
    </div>
    <div class="clock" id="clock" role="timer" aria-label="Current time"></div>
  </header>

  <main>
    <label class="section-label" for="note-input">New Entry</label>
    <textarea
      id="note-input"
      placeholder="Start typing — timestamp captured at first keystroke…"
      rows="4"
      spellcheck="true"
      autocomplete="off"
    ></textarea>
    <p class="input-hint">
      <kbd>↵ Enter</kbd> to save &nbsp;·&nbsp; <kbd>⇧ Shift+Enter</kbd> for newline
    </p>

    <hr>

    <div class="toolbar">
      <span class="entry-count">Entries &thinsp;<strong id="note-count">0</strong></span>
      <button class="download-btn" id="download-btn" title="Export notes as JSON">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 1v7M3 6l3 3 3-3M1 10h10"/>
        </svg>
        Export JSON
      </button>
    </div>

    <ol class="notes-list" id="notes-list">
      <li class="empty-li" id="empty-li">
        <span class="empty-msg">No entries yet — start writing above.</span>
      </li>
    </ol>
  </main>

  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let notes = [];
    try { notes = JSON.parse(localStorage.getItem('field-notes') || '[]'); } catch (_) {}
    let noteStartTime = null;

    // ── DOM ────────────────────────────────────────────────────────────────
    const clockEl     = document.getElementById('clock');
    const dateEl      = document.getElementById('date-display');
    const textarea    = document.getElementById('note-input');
    const notesList   = document.getElementById('notes-list');
    const noteCountEl = document.getElementById('note-count');
    const downloadBtn = document.getElementById('download-btn');

    // ── Clock ──────────────────────────────────────────────────────────────
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      const d = new Date();
      const h = pad(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
      clockEl.innerHTML = `${h}:${m}:<span class="clock-sec">${s}</span>`;
      clockEl.setAttribute('aria-label', `Current time: ${h}:${m}:${s}`);
      dateEl.textContent = d.toLocaleDateString('en-GB', {
        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
      }).toUpperCase();
    }
    tick();
    setInterval(tick, 1000);

    // ── Timestamp on first keystroke ───────────────────────────────────────
    textarea.addEventListener('input', () => {
      if (noteStartTime === null && textarea.value.length > 0) {
        noteStartTime = new Date().toISOString();
      }
      if (textarea.value.length === 0) noteStartTime = null;
    });

    // ── Submit on Enter ────────────────────────────────────────────────────
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = textarea.value.trim();
        if (!text) return;

        const entry = { timestamp: noteStartTime ?? new Date().toISOString(), note: text };
        notes.unshift(entry);
        persist();
        removeEmptyState();
        prependNote(entry, true);
        updateCount();

        textarea.value = '';
        noteStartTime = null;
        textarea.focus();
      }
    });

    // ── Helpers ────────────────────────────────────────────────────────────
    function fmtTime(iso) {
      const d = new Date(iso);
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short'
      }).toUpperCase();
    }

    function prependNote(entry, animate = false) {
      const li   = document.createElement('li');
      if (animate) li.classList.add('new');

      const ts   = document.createElement('time');
      ts.dateTime = entry.timestamp;
      ts.className = 'note-ts';
      ts.innerHTML  = fmtTime(entry.timestamp) +
        `<span class="note-ts-date">${fmtDate(entry.timestamp)}</span>`;

      const body = document.createElement('span');
      body.className = 'note-body';
      body.textContent = entry.note;  // textContent — XSS safe

      li.append(ts, body);
      notesList.prepend(li);
    }

    function removeEmptyState() {
      const el = document.getElementById('empty-li');
      if (el) el.remove();
    }

    function updateCount() { noteCountEl.textContent = notes.length; }

    function persist() {
      try { localStorage.setItem('field-notes', JSON.stringify(notes)); } catch (_) {}
    }

    // ── Initial render ─────────────────────────────────────────────────────
    if (notes.length > 0) {
      removeEmptyState();
      // notes is stored newest-first; render oldest→newest so prepend gives newest-at-top
      for (let i = notes.length - 1; i >= 0; i--) prependNote(notes[i]);
      updateCount();
    }

    // ── Export ─────────────────────────────────────────────────────────────
    downloadBtn.addEventListener('click', () => {
      if (!notes.length) return;
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `field-notes-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>

</body>
</html>
